# Отправка новых и изменённых страниц блога в IndexNow (Яндекс, Bing и др.).
# Запускается сам после каждой публикации (push в main, который меняет docs/).
# Вручную (вкладка Actions → IndexNow → Run workflow) отправляет ВСЕ адреса из sitemap.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Собрать список адресов
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess
          site = "https://blog.nmedia.pro"
          before = os.environ.get("BEFORE", "")
          urls = []
          if os.environ["EVENT"] == "push" and before and not set(before) <= {"0"}:
              out = subprocess.run(["git", "diff", "--name-only", before, "HEAD", "--", "docs"],
                                   capture_output=True, text=True).stdout.split()
              for p in out:
                  if p == "docs/index.html":
                      urls.append(site + "/")
                  else:
                      m = re.fullmatch(r"docs/([^/]+)/index\.html", p)
                      if m and os.path.exists(p):
                          urls.append(f"{site}/{m.group(1)}/")
              if urls and site + "/" not in urls:
                  urls.insert(0, site + "/")
          else:
              xml = open("docs/sitemap.xml", encoding="utf-8").read()
              urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          urls = list(dict.fromkeys(urls))
          open("urls.txt", "w").write("\n".join(urls))
          print(f"адресов к отправке: {len(urls)}")
          print("\n".join(urls))
          EOF

      - name: Дождаться выкладки GitHub Pages
        run: |
          [ -s urls.txt ] || { echo "нечего отправлять"; exit 0; }
          KEY=$(tr -d '[:space:]' < indexnow.key)
          sleep 60
          for i in $(seq 1 40); do
            ok=1
            [ "$(curl -s https://blog.nmedia.pro/$KEY.txt | tr -d '[:space:]')" = "$KEY" ] || ok=0
            while read -r u; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
              [ "$code" = "200" ] || { ok=0; break; }
            done < urls.txt
            [ $ok = 1 ] && { echo "сайт выложен, ключ на месте"; exit 0; }
            sleep 15
          done
          echo "::warning::не все страницы отдают 200, отправляю как есть"

      - name: Отправить в IndexNow
        run: |
          [ -s urls.txt ] || exit 0
          python3 - <<'EOF'
          import json, urllib.request
          key = open("indexnow.key").read().strip()
          urls = [u for u in open("urls.txt").read().split("\n") if u]
          body = json.dumps({"host": "blog.nmedia.pro", "key": key,
                             "keyLocation": f"https://blog.nmedia.pro/{key}.txt",
                             "urlList": urls}).encode()
          bad = 0
          for ep in ["https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"]:
              req = urllib.request.Request(ep, data=body, method="POST",
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(ep, "HTTP", r.status)
              except urllib.error.HTTPError as e:
                  print(ep, "HTTP", e.code, e.read()[:300])
                  bad += 1
              except Exception as e:
                  print(ep, "ошибка", e)
                  bad += 1
          if bad == 2:
              raise SystemExit("IndexNow не принял адреса ни в одном адресе приёма")
          EOF
