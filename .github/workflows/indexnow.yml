name: IndexNow (Яндекс и Bing)

# После каждой публикации в main шлёт новые и обновлённые адреса статей
# в IndexNow. Работает на серверах GitHub, поэтому не зависит от сети
# облачного прогона Claude. Ключ: indexnow.key, файл ключа: root/<key>.txt
# (build.py кладёт его в корень сайта).
# Ручной запуск (Actions → IndexNow → Run workflow) отправляет весь sitemap.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/indexnow.yml"]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Собрать список адресов
        id: urls
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          site = "https://blog.nmedia.pro"
          sitemap = open("docs/sitemap.xml", encoding="utf-8").read()
          all_urls = re.findall(r"<loc>([^<]+)</loc>", sitemap)
          before = os.environ.get("BEFORE", "")
          wf_changed = False
          urls = []
          if os.environ["EVENT"] == "push" and before and not set(before) <= {"0"}:
              try:
                  diff = subprocess.run(["git", "diff", "--name-only", before, "HEAD"],
                                        capture_output=True, text=True, check=True).stdout.split()
              except subprocess.CalledProcessError:
                  diff = []
              wf_changed = ".github/workflows/indexnow.yml" in diff
              def real_change(f):
                  # каждая сборка меняет только ?v= у style.css: такие страницы не шлём
                  out = subprocess.run(["git", "diff", "-U0", before, "HEAD", "--", f],
                                       capture_output=True, text=True).stdout.splitlines()
                  lines = [l for l in out if l[:1] in "+-" and not l.startswith(("+++", "---"))]
                  return any("style.css?v=" not in l for l in lines)
              for f in diff:
                  m = re.fullmatch(r"docs/([^/]+)/index\.html", f)
                  if m and m.group(1) != "_preview" and real_change(f):
                      urls.append(f"{site}/{m.group(1)}/")
              if "docs/index.html" in diff and real_change("docs/index.html"):
                  urls.append(f"{site}/")
          if os.environ["EVENT"] != "push" or wf_changed or not before:
              urls = all_urls
          urls = [u for u in dict.fromkeys(urls) if os.path.exists("docs" + u[len(site):] + "index.html") or u == f"{site}/"]
          open("urls.txt", "w").write("\n".join(urls))
          print(f"адресов к отправке: {len(urls)}")
          print("\n".join(urls))
          PY

      - name: Дождаться выкладки GitHub Pages
        run: |
          KEY=$(tr -d ' \n\r' < indexnow.key)
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://blog.nmedia.pro/${KEY}.txt?nocache=$(date +%s)" 2>/dev/null | tr -d ' \n\r' || true)
            if [ "$got" = "$KEY" ]; then echo "файл ключа на месте"; break; fi
            sleep 10
          done
          [ "$got" = "$KEY" ] || { echo "файл ключа не открылся на сайте"; exit 1; }
          sleep 30

      - name: Отправить в IndexNow
        run: |
          [ -s urls.txt ] || { echo "нечего отправлять"; exit 0; }
          KEY=$(tr -d ' \n\r' < indexnow.key)
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request, urllib.error
          key = sys.argv[1]
          urls = [u for u in open("urls.txt").read().split("\n") if u]
          body = json.dumps({"host": "blog.nmedia.pro", "key": key,
                             "keyLocation": f"https://blog.nmedia.pro/{key}.txt",
                             "urlList": urls}).encode()
          failed = False
          for ep in ("https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"):
              req = urllib.request.Request(ep, data=body, method="POST",
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(ep, "->", r.status)
              except urllib.error.HTTPError as e:
                  print(ep, "->", e.code, e.read()[:300])
                  failed = True
          sys.exit(1 if failed else 0)
          PY
